name: iPhone Arbitraj 999.md

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iphone-arb/**'
      - '.github/workflows/iphone-arb.yml'
  workflow_dispatch:
    inputs:
      force:
        description: "Trimite pe Telegram toate deal-urile curente (test), ignora dedup"
        type: boolean
        default: false
  schedule:
    - cron: '0 */3 * * *'   # la 3h (branch default: main)

permissions:
  contents: write   # ca sa salvam state/seen.json (dedup Telegram)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES: '20'
      MIN_GROUP: '4'
      DEAL_THRESHOLD: '0.15'
      FEE_EUR: '15'
      MIN_BATTERY: '80'
      MIN_PROFIT: '50'      # profit net minim (EUR) ca sa-ti trimita pe Telegram
      MAX_ENRICH: '80'      # cati candidati verificam in descriere
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FORCE_ALL: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Scan 999.md + alert Telegram
        run: python scripts/iphone-arb/scan.py
      - name: Persist seen state (dedup)
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update deals state"
            git push origin HEAD:main
          else
            echo "no state change"
          fi
